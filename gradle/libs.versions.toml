[versions]
agp = "9.3.1"
# Gradle Play Publisher: a build can reach the internal track without the console
playPublisher = "4.1.1"
kotlin = "2.4.10"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycleViewmodelCompose = "2.9.1"
junit = "4.13.2"
spotless = "8.9.0"
ktlint = "1.8.0"
robolectric = "4.16"
roborazzi = "1.71.0"
detekt = "1.23.8"
dokka = "2.2.0"
composeRules = "0.6.4"
coroutines = "1.11.0"
media3 = "1.11.0"
material-mdc = "1.13.0"
coil = "3.2.0"
navigation = "2.9.8"
# 5.x for its connect fallback, which is what keeps the skin browser filling;
# see MuseumHttp. 5.4+ wants compileSdk 37, so this waits for that bump.
okhttp = "5.3.0"
luaj = "3.0.1"
# the source SDK this build publishes: :core:model, :core:playback,
# :core:network, :core:packapi and :pack:common, under the names below. One
# number for the five, because a source takes them together.
andampSdk = "0.1.0"
mavenPublish = "0.37.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# for com.google.android.material.color.utilities: Material's own color engine
material-mdc = { group = "com.google.android.material", name = "material", version.ref = "material-mdc" }
# thumbnails for the online skin browser: memory + disk cache, cancels with the scroll
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# pinned: recent Compose BOMs no longer manage the icons artifacts
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
luaj = { group = "org.luaj", name = "luaj-jse", version.ref = "luaj" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-test-utils = { group = "androidx.media3", name = "media3-test-utils", version.ref = "media3" }
media3-test-utils-robolectric = { group = "androidx.media3", name = "media3-test-utils-robolectric", version.ref = "media3" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
androidx-test-core = { group = "androidx.test", name = "core", version = "1.7.0" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.7.0" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
detekt-compose-rules = { group = "io.nlopez.compose.rules", name = "detekt", version.ref = "composeRules" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
